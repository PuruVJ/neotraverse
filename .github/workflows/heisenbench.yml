name: Heisenbench

# Counts the work each function does (`pnpm bench:count`) on the PR head and on the commit it
# branched from, and posts the difference as one PR comment. Counts are exact, so one run of
# each side is enough and the runner's speed does not matter. Heisenbench needs Node 26.4+;
# the other workflows stay on Node 24.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: heisenbench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  count:
    # Runs the PR's code, so it can write nothing: no token is left in the checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Count the PR
        run: |
          pnpm install --frozen-lockfile
          pnpm bench:count
          mkdir -p "$RUNNER_TEMP/heisenbench"
          cp packages/neotraverse/bench/heisenbench.json "$RUNNER_TEMP/heisenbench/head.json"

      - name: Count the base
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          git worktree add "$RUNNER_TEMP/base" "$base"
          cd "$RUNNER_TEMP/base"
          if ! grep -q '"bench:count"' package.json; then
            echo "counted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm install --frozen-lockfile
          pnpm bench:count
          cp packages/neotraverse/bench/heisenbench.json "$RUNNER_TEMP/heisenbench/base.json"
          echo "counted=true" >> "$GITHUB_OUTPUT"

      - name: Diff
        env:
          COUNTED: ${{ steps.base.outputs.counted }}
        run: |
          out="$RUNNER_TEMP/heisenbench"
          if [ "$COUNTED" = "true" ]; then
            cd packages/neotraverse
            pnpm exec heisenbench diff "$out/base.json" "$out/head.json" --repo ../.. --out "$out/section.md"
          else
            echo "The base commit has no \`bench:count\` script yet, so there is nothing to compare against." > "$out/section.md"
          fi
          cat "$out/section.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heisenbench
          path: ${{ runner.temp }}/heisenbench

  comment:
    # Holds the write token and runs nothing from the PR: it reads `section.md` as text.
    needs: count
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: heisenbench
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- neotraverse-heisenbench -->'
          body="$(printf '%s\n\n%s' "$marker" "$(head -c 60000 section.md)")"
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GH_REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
