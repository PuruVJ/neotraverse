name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Security regression tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck gate (strict: full strict + noUnusedLocals/noUnusedParameters on the
      # library source) so a PR that weakens a guard's types or leaves dead code is flagged.
      - name: Typecheck
        run: pnpm --filter neotraverse exec tsc --noEmit -p tsconfig.build.json
      # Security gate: the prototype-pollution, DoS, type-confusion and isolation
      # regression suites. Any PR that reintroduces an audited vulnerability fails here.
      - name: Run security regression suites
        run: >-
          pnpm exec vp test
          packages/neotraverse/test/security.test.ts
          packages/neotraverse/test/functional-security.test.ts
          packages/neotraverse/test/security-audit.test.ts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        # neotraverse ships zero runtime deps — `--prod` audits exactly what
        # reaches consumers. Dev-tooling advisories are handled by dependency
        # review / Dependabot, not this release gate.
        run: pnpm audit --prod --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Review dependencies
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          # Mirror the `pnpm audit --prod --audit-level=high` gate: neotraverse ships
          # ZERO runtime deps, so only fail on high-severity advisories in runtime-scoped
          # dependencies. Dev/build-tool advisories (e.g. a moderate Vite dev-server CVE
          # pulled in transitively by VitePress) never reach consumers and must not block
          # PRs. Real shipped-dependency risk is still gated.
          fail-on-severity: high
          fail-on-scopes: runtime
